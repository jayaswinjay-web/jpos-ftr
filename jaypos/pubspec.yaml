name: jaypos
description: Cross-platform offline-first POS system for retail stores, restaurants, and cafés.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local Database
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Networking / Backend
  dio: ^5.4.3+1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Barcode Scanning (Android)
  mobile_scanner: ^5.1.1

  # Barcode / QR Generation
  qr_flutter: ^4.1.0
  barcode: ^2.2.8
  barcode_widget: ^2.0.4

  # Printing
  printing: ^5.13.0
  pdf: ^3.11.0
  print_bluetooth_thermal: ^1.2.2

  # Excel/CSV
  excel: ^4.0.1
  csv: ^6.0.0

  # Charts
  fl_chart: ^0.68.0

  # Image
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Background Services (Android)
  flutter_background_service: ^5.0.5
  # flutter_boot_receiver: ^1.3.0  # removed - incompatible with Flutter 3.44, using native BootReceiver.kt instead

  # Biometric
  local_auth: ^2.2.0

  # Date/Time
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^17.2.1+2

  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Utilities
  audioplayers: ^6.1.0
  uuid: ^4.4.0
  collection: ^1.18.0
  crypto: ^3.0.3
  archive: ^3.6.1
  share_plus: ^10.0.0
  url_launcher: ^6.2.6
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
